<!-- #ff1f9e is the key pink, same as the tittle in the wordmark. Do not write
     the CSS token name here: a double hyphen is illegal inside an XML comment
     and silently breaks the whole file. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#ff1f9e"/>
</svg>
